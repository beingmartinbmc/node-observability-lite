version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      ecosystem:
        patterns:
          - "node-actuator-lite"
          - "node-eventloop-watchdog"
          - "node-request-trace"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - github-actions
