name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage gate
        if: matrix.node == '20'
        run: npm run test:coverage:check

      - name: Test
        if: matrix.node != '20'
        run: npm test

      - name: Package dry run
        if: matrix.node == '20'
        run: npm run build

  smoke:
    name: Smoke (Express/Fastify/Koa)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm install

      - name: Install peer frameworks for smoke
        run: npm install --no-save express fastify koa

      - name: Smoke Express
        run: npm run smoke:express

      - name: Smoke Fastify
        run: npm run smoke:fastify

      - name: Smoke Koa
        run: npm run smoke:koa
